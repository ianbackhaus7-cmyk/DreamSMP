<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamSMP</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}

body{
    background: radial-gradient(circle at top,#1a0033,#000);
    color:white;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:20px 40px;
    background:rgba(0,0,0,0.7);
}

.nav a{
    margin:0 10px;
    color:white;
    text-decoration:none;
}

/* HERO */
.hero{
    text-align:center;
    padding:100px 20px;
}

.hero h1{
    font-size:120px;
    color:#ff00ff;
    text-shadow:0 0 40px #ff00ff;
}

.btn{
    display:inline-block;
    margin:10px;
    padding:15px 30px;
    border-radius:10px;
    background:linear-gradient(45deg,#ff00ff,#8000ff);
    cursor:pointer;
}

/* SHOP */
.shop{
    display:none;
    padding:40px;
    text-align:center;
}

.shop-items{
    display:flex;
    justify-content:center;
    gap:20px;
}

.item{
    background:rgba(255,255,255,0.05);
    padding:20px;
    border-radius:15px;
    width:200px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
    <h2>DS DreamSMP</h2>
    <div class="nav">
        <a onclick="showHome()">Home</a>
        <a onclick="showShop()">Shop</a>
    </div>
</div>

<!-- HOME -->
<div id="home" class="hero">
    <h1>DS</h1>
    <h2>DREAMSMP</h2>
    <p>Dein Server. Deine Community.</p>

    <div class="btn" onclick="showShop()">Zum Shop</div>
</div>

<!-- SHOP -->
<div id="shop" class="shop">
    <h1>Shop</h1>

    <div class="shop-items">

        <div class="item">
            <h2>VIP</h2>
            <p>5€</p>
            <div class="btn" onclick="buy('VIP',5)">Kaufen</div>
        </div>

        <div class="item">
            <h2>MVP</h2>
            <p>10€</p>
            <div class="btn" onclick="buy('MVP',10)">Kaufen</div>
        </div>

        <div class="item">
            <h2>LEGEND</h2>
            <p>20€</p>
            <div class="btn" onclick="buy('LEGEND',20)">Kaufen</div>
        </div>

    </div>

    <br>
    <div class="btn" onclick="showHome()">Zurück</div>
</div>

<script>
function showShop(){
    document.getElementById("home").style.display="none";
    document.getElementById("shop").style.display="block";
}

function showHome(){
    document.getElementById("home").style.display="block";
    document.getElementById("shop").style.display="none";
}

// PAYMENT
function buy(product, price){
    fetch("http://localhost:3000/create-checkout",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({product,price})
    })
    .then(res=>res.json())
    .then(data=>{
        window.location=data.url;
    })
    .catch(()=>{
        alert("Server nicht verbunden (Backend starten!)");
    });
}
</script>

</body>
</html>
