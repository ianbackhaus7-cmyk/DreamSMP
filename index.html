<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamSMP</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #1a0033, #000);
    color: white;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    background: rgba(0,0,0,0.7);
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #ff00ff;
}

.nav-links a {
    margin: 0 15px;
    text-decoration: none;
    color: white;
}

/* Hero */
.hero {
    text-align: center;
    padding: 100px 20px;
}

.hero h1 {
    font-size: 100px;
    color: #ff00ff;
    margin: 0;
}

.hero h2 {
    font-size: 40px;
    margin: 10px 0;
}

.btn {
    background: linear-gradient(45deg, #ff00ff, #9900ff);
    padding: 15px 30px;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    display: inline-block;
    margin-top: 20px;
}

/* Cards */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 40px;
}

.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255,0,255,0.3);
}

.card h3 {
    color: #ff00ff;
}
</style>

</head>
<body>

<div class="navbar">
    <div class="logo">DS DreamSMP</div>
    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Vote</a>
        <a href="#">Team</a>
        <a href="#">Discord</a>
    </div>
</div>

<div class="hero">
    <h1>DS</h1>
    <h2>DREAMSMP</h2>
    <p>Dein Abenteuer. Dein Server. Deine Community.</p>
    <a class="btn" href="#">Jetzt Spielen</a>
</div>

<div class="cards">
    <div class="card">
        <h3>Discord</h3>
        <p>Tritt unserem Discord bei!</p>
    </div>

    <div class="card">
        <h3>Ränge kaufen</h3>
        <p>Hol dir exklusive Vorteile!</p>
    </div>

    <div class="card">
        <h3>Vote</h3>
        <p>Erhalte Belohnungen fürs Voten!</p>
    </div>

    <div class="card">
        <h3>Features</h3>
        <p>Economy, PvP, Events & mehr</p>
    </div>
</div>

</body>
</html>
