<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DreamSMP Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    background:#090009;
    color:white;
}


/* LOGIN */

#login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.login-box{
    background:#180018;
    padding:40px;
    border-radius:20px;
    box-shadow:0 0 40px #ff00ff;
    text-align:center;
}


input{
    display:block;
    margin:15px auto;
    padding:12px;
    width:250px;
    border-radius:10px;
    border:none;
}


button{
    padding:15px 30px;
    border:none;
    border-radius:12px;
    background:#ff00ff;
    color:white;
    cursor:pointer;
    box-shadow:0 0 20px #ff00ff;
}



/* DASHBOARD */

#dashboard{
    display:none;
    height:100vh;

    background:
    radial-gradient(circle,#ff00aa,#4b004b,#000);

    justify-content:center;
    align-items:center;
    flex-direction:column;
}


h1{
    font-size:70px;
    text-shadow:0 0 30px white;
}


.cards{

    display:flex;
    gap:30px;
    margin-top:50px;

}


.card{

    width:250px;
    height:180px;

    background:rgba(255,255,255,0.15);

    border:2px solid #ff99ff;

    border-radius:25px;

    display:flex;
    justify-content:center;
    align-items:center;

    flex-direction:column;

    cursor:pointer;

    transition:.3s;

}


.card:hover{

    transform:translateY(-15px) scale(1.05);

    box-shadow:0 0 40px white;

}


.card h2{

    font-size:30px;

}


.card p{

    margin-top:15px;

}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="login">


<div class="login-box">

<h1 style="font-size:40px;">DS Login</h1>


<input id="name" placeholder="Minecraft Name">


<input id="pass" type="password" placeholder="Passwort">


<button onclick="login()">
Einloggen
</button>


</div>


</div>



<!-- DASHBOARD -->


<div id="dashboard">


<h1>
DS DREAMSMP
</h1>


<div class="cards">


<div class="card" onclick="shop()">

<h2>🛒 SHOP</h2>

<p>VIP • PRIME • Ränge</p>

</div>



<div class="card" onclick="discord()">

<h2>💬 DISCORD</h2>

<p>Community beitreten</p>

</div>



<div class="card" onclick="server()">

<h2>🎮 SERVER</h2>

<p>Minecraft spielen</p>

</div>


</div>


</div>




<script>


function login(){


let user=document.getElementById("name").value;
let pass=document.getElementById("pass").value;


if(user && pass){


document.getElementById("login").style.display="none";


document.getElementById("dashboard").style.display="flex";


}

else{


alert("Bitte Daten eingeben!");

}


}





function shop(){

window.open(
"https://DEINSHOP.tebex.io",
"_blank"
);

}



function discord(){

window.open(
"https://discord.gg/DEINLINK",
"_blank"
);

}



function server(){


let ip="play.dreamsmp.de";


navigator.clipboard.writeText(ip);


alert(
"Server IP kopiert: "+ip
);


}


</script>


</body>
</html>
