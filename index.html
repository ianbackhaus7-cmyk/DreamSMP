<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamSMP</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
html{scroll-behavior:smooth;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
    background: radial-gradient(circle,#1a0033,#000);
    color:white;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:20px 60px;
    background:rgba(0,0,0,0.7);
    border-bottom:1px solid #ff00ff33;
    position:sticky;
    top:0;
}

.logo{color:#ff00ff;font-size:24px;font-weight:bold;}

.nav a{
    margin:0 12px;
    color:#ddd;
    text-decoration:none;
    cursor:pointer;
}

/* HERO */
.hero{text-align:center;padding:120px 20px;position:relative;}

.hero h1{
    font-size:150px;
    color:#ff00ff;
    text-shadow:0 0 60px #ff00ff;
}

.hero h2{font-size:50px;}

.btn{
    display:inline-block;
    margin:15px;
    padding:15px 40px;
    border-radius:12px;
    background:linear-gradient(45deg,#ff00ff,#8000ff);
    color:white;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 0 20px #ff00ff;
}

/* PANELS */
.side{
    position:absolute;
    top:120px;
    width:260px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.05);
}

.left{left:30px;}
.right{right:30px;}

.side h4{color:#ff00ff;margin-top:10px;}

/* SECTIONS */
.section{padding:80px 40px;}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,0.05);
    padding:25px;
    border-radius:15px;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
    <div class="logo">DS DREAMSMP</div>
    <div class="nav">
        <a onclick="scrollToSection('home')">Home</a>
        <a onclick="scrollToSection('shop')">Shop</a>
        <a onclick="scrollToSection('vote')">Vote</a>
        <a onclick="scrollToSection('discord')">Discord</a>
    </div>
</div>

<!-- HERO -->
<div class="hero" id="home">

<div class="side left">
    <h4>SERVER IP</h4>
    <p>play.dreamsmp.de</p>

    <h4>ONLINE SPIELER</h4>
    <p>128 / 300</p>
</div>

<h1>DS</h1>
<h2>DREAMSMP</h2>

<p>DEIN SERVER. DEINE COMMUNITY.</p>

<a class="btn" onclick="copyIP()">
<i class="fa-solid fa-gamepad"></i> Jetzt Spielen
</a>

<a class="btn" onclick="openDiscord()">
<i class="fa-brands fa-discord"></i> Discord
</a>

<div class="side right">
    <h4>✔ Custom Items</h4>
    <h4>✔ Skillsystem</h4>
    <h4>✔ Events</h4>
</div>

</div>

<!-- SHOP -->
<div class="section" id="shop">
<h1>Shop</h1>
<a class="btn" onclick="openShop()">Zum Shop</a>
</div>

<!-- VOTE -->
<div class="section" id="vote">
<h1>Vote</h1>
<a class="btn" onclick="openVote()">Jetzt voten</a>
</div>

<!-- DISCORD -->
<div class="section" id="discord">
<h1>Discord</h1>
<a class="btn" onclick="openDiscord()">Beitreten</a>
</div>

<script>

function copyIP(){
    navigator.clipboard.writeText("play.dreamsmp.de");
    alert("IP kopiert!");
}

function openDiscord(){
    window.open("https://discord.gg/DEINLINK", "_blank");
}

function openShop(){
    window.open("https://DEINSHOP.tebex.io", "_blank");
}

function openVote(){
    window.open("https://minecraft-server.eu/vote/index/DEINSERVER", "_blank");
}

function scrollToSection(id){
    document.getElementById(id).scrollIntoView();
}

</script>

</body>
</html>
