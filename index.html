<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DreamSMP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
background:#090009;
color:white;
}

#start{

height:100vh;

background:
radial-gradient(circle,#ff00aa,#4b004b,#000);

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

}

h1{

font-size:70px;
text-shadow:0 0 30px white;

}

.cards{

display:flex;
gap:30px;
margin-top:50px;

}

.card{

width:250px;
height:180px;

background:rgba(255,255,255,0.15);

border:2px solid #ff99ff;

border-radius:25px;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

cursor:pointer;

transition:.3s;

}

.card:hover{

transform:scale(1.08);

box-shadow:0 0 40px white;

}

.card h2{

font-size:30px;

}

#shop{

display:none;

height:100vh;

background:#090009;

text-align:center;

padding-top:50px;

}

.shopbox{

display:inline-block;

background:#180018;

padding:30px;

margin:20px;

border-radius:20px;

box-shadow:0 0 30px #ff00ff;

}

button{

padding:15px 30px;

background:#ff00ff;

color:white;

border:none;

border-radius:15px;

cursor:pointer;

}

</style>

</head>


<body>


<!-- STARTSEITE -->

<div id="start">


<h1>
DS DREAMSMP
</h1>


<div class="cards">


<div class="card" onclick="openShop()">

<h2>🛒 SHOP</h2>

<p>VIP • PRIME • Ränge</p>

</div>



<div class="card" onclick="discord()">

<h2>💬 DISCORD</h2>

<p>Community</p>

</div>



<div class="card" onclick="server()">

<h2>🎮 SERVER</h2>

<p>IP kopieren</p>

</div>


</div>


</div>




<!-- SHOP -->

<div id="shop">


<h1>DS SHOP</h1>


<div class="shopbox">

<h2>⭐ VIP</h2>

<p>VIP Rang für den Server</p>

<br>

<button onclick="vip()">
Kaufen
</button>

</div>



<div class="shopbox">

<h2>💎 PRIME</h2>

<p>Prime Rang für den Server</p>

<br>

<button onclick="prime()">
Kaufen
</button>

</div>


<br><br>


<button onclick="back()">
Zurück
</button>


</div>




<script>


function openShop(){

document.getElementById("start").style.display="none";

document.getElementById("shop").style.display="block";

}



function back(){

document.getElementById("shop").style.display="none";

document.getElementById("start").style.display="flex";

}




function discord(){

window.open(
"https://discord.gg/g7QCRZgqz",
"_blank"
);

}




function server(){

let ip="DreamSMP.eu";

navigator.clipboard.writeText(ip);

alert(
"Server IP kopiert: "+ip
);

}




function vip(){

window.open(
"DEIN-TEBEX-VIP-LINK",
"_blank"
);

}



function prime(){

window.open(
"DEIN-TEBEX-PRIME-LINK",
"_blank"
);

}


</script>


</body>

</html>
