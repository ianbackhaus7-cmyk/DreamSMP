<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DreamSMP.eu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #07070d;
        }

        .website {
            position: relative;
            width: 100%;
            max-width: 1536px;
            margin: auto;
        }

        .website img {
            display: block;
            width: 100%;
            height: auto;
        }

        /*
        Discord-Button oben rechts
        */

        .discord-top {
            position: absolute;
            top: 2.1%;
            right: 2.5%;
            width: 12.8%;
            height: 4.2%;
            cursor: pointer;
            z-index: 5;
        }

        /*
        Discord-Button in der Mitte
        */

        .discord-main {
            position: absolute;
            top: 38.8%;
            left: 22.8%;
            width: 17.5%;
            height: 7%;
            cursor: pointer;
            z-index: 5;
        }

        /*
        Premium kaufen
        */

        .premium-button {
            position: absolute;
            top: 92.4%;
            left: 8.5%;
            width: 38.5%;
            height: 5.5%;
            cursor: pointer;
            z-index: 5;
        }

        /*
        VIP kaufen
        */

        .vip-button {
            position: absolute;
            top: 92.4%;
            right: 8.5%;
            width: 38.5%;
            height: 5.5%;
            cursor: pointer;
            z-index: 5;
        }

        /*
        Wenn man mit der Maus über die klickbaren Bereiche geht
        */

        .discord-top:hover,
        .discord-main:hover,
        .premium-button:hover,
        .vip-button:hover {
            filter: brightness(1.15);
        }

        @media (max-width: 700px) {

            .discord-top {
                width: 20%;
                right: 3%;
            }

            .discord-main {
                left: 23%;
                width: 22%;
            }
        }
    </style>
</head>

<body>

    <div class="website">

        <!-- Dein exakt verwendetes Bild -->
        <img src="32947.png" alt="DreamSMP Webseite">

        <!-- Discord oben rechts -->
        <a
            class="discord-top"
            href="https://discord.gg/g7QCRZgqz"
            target="_blank"
            rel="noopener noreferrer">
        </a>

        <!-- Discord Button in der Mitte -->
        <a
            class="discord-main"
            href="https://discord.gg/g7QCRZgqz"
            target="_blank"
            rel="noopener noreferrer">
        </a>

        <!-- Premium -->
        <a
            class="premium-button"
            href="premium.html">
        </a>

        <!-- VIP -->
        <a
            class="vip-button"
            href="vip.html">
        </a>

    </div>

</body>
</html>
