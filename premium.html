<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium kaufen | DreamSMP</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

.buy-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:120px 20px;
    background:#09080d;
}

.buy-card{

    width:600px;
    background:#13111d;
    border-radius:18px;
    padding:40px;
    border:1px solid rgba(255,255,255,.08);
    text-align:center;

}

.buy-card img{

    width:160px;
    margin-bottom:20px;

}

.buy-card h1{

    color:#9d62ff;
    margin-bottom:10px;

}

.buy-card h2{

    font-size:38px;
    margin-bottom:25px;

}

.buy-card ul{

    list-style:none;
    text-align:left;
    margin:30px 0;

}

.buy-card li{

    padding:10px;

}

.buy-card li::before{

content:"✔ ";
color:#8a3cff;

}

input{

width:100%;
padding:18px;
margin-top:20px;
border:none;
border-radius:12px;
background:#1b1826;
color:white;
font-size:17px;

}

.buy{

width:100%;
margin-top:30px;
padding:18px;
background:#7d33ff;
border:none;
border-radius:12px;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;

}

.buy:hover{

background:#9254ff;

}

.back{

display:inline-block;
margin-top:25px;
color:#9d62ff;
text-decoration:none;

}

</style>

</head>

<body>

<section class="buy-page">

<div class="buy-card">

<img src="assets/crown.png">

<h1>Premium Rang</h1>

<h2>4,99 €</h2>

<ul>

<li>Premium Prefix</li>
<li>/back</li>
<li>Mehr Homes</li>
<li>Premium Kit</li>
<li>Priorität beim Joinen</li>

</ul>

<input
type="text"
id="player"
placeholder="Minecraft-Spielername">

<button class="buy" onclick="buyPremium()">
Premium kaufen
</button>

<a class="back" href="index.html">
← Zurück
</a>

</div>

</section>

<script>

function buyPremium(){

const player=document.getElementById("player").value;

if(player==""){

alert("Bitte gib deinen Minecraft Namen ein.");

return;

}

localStorage.setItem("player",player);

localStorage.setItem("product","Premium");

localStorage.setItem("price","4,99 €");

window.location.href="checkout.html";

}

</script>

</body>
</html>
